services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sed
      POSTGRES_USER: sed
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-sed}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed -d sed"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/sed
      DATABASE_USER: sed
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-sed}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo123}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
